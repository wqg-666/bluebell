basePath: /api/v1
definitions:
  controller.ResCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    format: int64
    type: integer
    x-enum-comments:
      CodeSucess: 是 Go 常量块里 "从 1000 开始自动递增" 的写法，生成的是 1000、1001、1002
    x-enum-descriptions:
    - 是 Go 常量块里 "从 1000 开始自动递增" 的写法，生成的是 1000、1001、1002
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    x-enum-varnames:
    - CodeSucess
    - CodeInvalidParam
    - CodeUserExist
    - CodeUserNotExist
    - CodeInvalidPassword
    - CodeServerBusy
    - CodeNeedLogin
    - CodeInvalidToken
  controller.SwaggerCommunityDetailResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controller.ResCode'
        example: 1000
      data:
        $ref: '#/definitions/models.CommunityDetail'
      msg:
        example: success
        type: string
    type: object
  controller.SwaggerCommunityListResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controller.ResCode'
        example: 1000
      data:
        items:
          $ref: '#/definitions/models.Community'
        type: array
      msg:
        example: success
        type: string
    type: object
  controller.SwaggerLoginData:
    properties:
      token:
        example: eyJhbGciOi...
        type: string
      user_id:
        example: "14361026703134720"
        type: string
      user_name:
        example: alice
        type: string
    type: object
  controller.SwaggerLoginResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controller.ResCode'
        example: 1000
      data:
        $ref: '#/definitions/controller.SwaggerLoginData'
      msg:
        example: success
        type: string
    type: object
  controller.SwaggerPostDetailResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controller.ResCode'
        example: 1000
      data:
        $ref: '#/definitions/models.ApiPostDetail'
      msg:
        example: success
        type: string
    type: object
  controller.SwaggerPostListResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controller.ResCode'
        example: 1000
      data:
        items:
          $ref: '#/definitions/models.ApiPostDetail'
        type: array
      msg:
        example: success
        type: string
    type: object
  controller.SwaggerResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controller.ResCode'
        example: 1000
      data: {}
      msg: {}
    type: object
  models.ApiPostDetail:
    properties:
      aouthor_name:
        type: string
      author_id:
        type: integer
      community:
        allOf:
        - $ref: '#/definitions/models.CommunityDetail'
        description: 嵌入社区帖子结构体
      community_id:
        type: integer
      content:
        type: string
      create_time:
        type: string
      id:
        description: string,可以使后端传很大的数给前端，自动解析为string,也可以使前端传给后端的string转为int
        example: "0"
        type: string
      status:
        type: integer
      title:
        type: string
      vote_num:
        type: integer
    required:
    - community_id
    - content
    - title
    type: object
  models.Community:
    properties:
      id:
        example: "0"
        type: string
      name:
        type: string
    type: object
  models.CommunityDetail:
    properties:
      create_time:
        type: string
      id:
        example: "0"
        type: string
      introduction:
        type: string
      name:
        type: string
    type: object
  models.ParamLogin:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.ParamSignUp:
    properties:
      password:
        type: string
      re_password:
        type: string
      username:
        type: string
    required:
    - password
    - re_password
    - username
    type: object
  models.ParamVoteData:
    properties:
      direction:
        description: 赞成票（1）反对票（-1）取消投票（0）
        enum:
        - 1
        - -1
        - 0
        example: "0"
        type: string
      post_id:
        description: UserID 从请求中获取当前的用户，request.getCurrentUserID
        type: string
    required:
    - post_id
    type: object
  models.Post:
    properties:
      author_id:
        type: integer
      community_id:
        type: integer
      content:
        type: string
      create_time:
        type: string
      id:
        description: string,可以使后端传很大的数给前端，自动解析为string,也可以使前端传给后端的string转为int
        example: "0"
        type: string
      status:
        type: integer
      title:
        type: string
    required:
    - community_id
    - content
    - title
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: Bluebell 社区服务 API 文档
  title: Bluebell API
  version: "1.0"
paths:
  /community:
    get:
      description: 获取所有社区的 ID 和名称
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SwaggerCommunityListResponse'
      security:
      - BearerAuth: []
      summary: 获取社区列表
      tags:
      - 社区
  /community/{id}:
    get:
      description: 根据社区 ID 获取社区信息
      parameters:
      - description: 社区 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SwaggerCommunityDetailResponse'
      security:
      - BearerAuth: []
      summary: 获取社区详情
      tags:
      - 社区
  /login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录并获取 JWT
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ParamLogin'
      produces:
      - application/json
      responses:
        "200":
          description: 成功时 data 中包含 token、user_id 和 user_name
          schema:
            $ref: '#/definitions/controller.SwaggerLoginResponse'
      summary: 用户登录
      tags:
      - 用户
  /post:
    post:
      consumes:
      - application/json
      description: 使用当前登录用户创建帖子
      parameters:
      - description: 帖子信息（community_id、title、content 必填）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Post'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: 创建帖子
      tags:
      - 帖子
  /post/{id}:
    get:
      description: 根据帖子 ID 获取帖子、作者和社区详情
      parameters:
      - description: 帖子 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SwaggerPostDetailResponse'
      security:
      - BearerAuth: []
      summary: 获取帖子详情
      tags:
      - 帖子
  /posts/:
    get:
      description: 按数据库分页获取帖子列表
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SwaggerPostListResponse'
      security:
      - BearerAuth: []
      summary: 获取帖子列表
      tags:
      - 帖子
  /posts2:
    get:
      description: 按时间或分数排序分页查询；可选 community_id 仅查询指定社区
      parameters:
      - description: 页码，默认取配置 post_list.page
        in: query
        name: page
        type: integer
      - description: 每页数量，默认取配置 post_list.size
        in: query
        name: size
        type: integer
      - description: 排序方式：time 或 score，默认取配置 post_list.order
        enum:
        - time
        - score
        in: query
        name: order
        type: string
      - description: 社区 ID；不传时查询所有社区
        in: query
        name: community_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SwaggerPostListResponse'
      security:
      - BearerAuth: []
      summary: 获取排序帖子列表
      tags:
      - 帖子
  /signup:
    post:
      consumes:
      - application/json
      description: 创建一个新用户账号
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ParamSignUp'
      produces:
      - application/json
      responses:
        "200":
          description: code 为 1000 表示成功，其他值表示业务错误
          schema:
            $ref: '#/definitions/controller.SwaggerResponse'
      summary: 用户注册
      tags:
      - 用户
  /vote:
    post:
      consumes:
      - application/json
      description: 对帖子赞成、反对或取消投票。direction 字段用字符串传递：1、-1 或 0
      parameters:
      - description: 投票信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ParamVoteData'
      produces:
      - application/json
      responses:
        "200":
          description: code 为 1000 表示成功，其他值表示业务错误
          schema:
            $ref: '#/definitions/controller.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: 给帖子投票
      tags:
      - 投票
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 请输入 Bearer 加空格和登录接口返回的 token，例如：Bearer eyJhbGciOi...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
